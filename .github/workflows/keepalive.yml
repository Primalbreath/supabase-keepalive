name: Supabase keep-alive

# Runs every 3 days (and on demand) so Supabase never sees 7 days of inactivity.
on:
  schedule:
    - cron: "17 20 */3 * *"   # ~6:17am AEST
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit a heartbeat so GitHub doesn't disable the schedule after 60 quiet days

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping each Supabase project
        env:
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
        run: bash scripts/ping.sh

      - name: Record heartbeat
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add last-ping.txt
          git commit -m "Heartbeat $(cat last-ping.txt)" || exit 0
          git push
